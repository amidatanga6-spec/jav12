[project]
name = "ricky"
version = "0.1.0"
description = "tele: @ovftank"
requires-python = ">=3.11"
dependencies = [
    "aiohttp==3.13.5",
    "cryptg==0.5.2",
    "fastapi[standard]==0.135.3",
    "hachoir==3.3.0",
    "pillow==12.2.0",
    "python-socketio==5.16.1",
    "telethon==1.43.0",
    "ty==0.0.51",
    "uvicorn==0.44.0",
    "websockets==16.0",
]
[tool.uv]
add-bounds = "exact"

[tool.ruff.lint]
ignore = ["BLE001", "S110"]
